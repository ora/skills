name: Evals

# Runs the eval suite (evals/) with `claude plugin eval`. Costs real API
# tokens, so it runs on demand and on PRs that touch skills or evals, capped
# at $15 per run, and skips cleanly when the ANTHROPIC_API_KEY secret is
# absent (forks). Requires eval early access on the account that owns the key.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Note when skipping
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY secret not set; skipping evals"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          claude plugin eval . \
            --allow-tools Bash Write Edit WebFetch \
            --no-publish \
            --threshold 0.6 \
            --max-cost-usd 15 \
            --json eval-result.json
      - name: Upload results
        if: env.ANTHROPIC_API_KEY != '' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: |
            eval-result.json
            evals/results/
          if-no-files-found: ignore
